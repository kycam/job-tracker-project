{% extends 'base.html' %}{% block content %}<header><div><small>RECORD EDITOR</small><h1>{{'Edit' if record.get(cfg.pk) else 'Add'}} {{'Company' if table == 'companies' else table[:-1]|title}}</h1></div></header><section class="editor"><form method="post"><div class="fields">{% for f in cfg.fields %}<label>{{cfg.labels[loop.index0]}}{% if f in cfg.required %} *{% endif %}{% if f in choices %}<select name="{{f}}" {% if f in cfg.required %}required{% endif %}><option value="">Select...</option>{% for value,label in choices[f] %}<option value="{{value}}" {% if record.get(f)|string==value %}selected{% endif %}>{{label}}</option>{% endfor %}</select>{% elif f in options %}<select name="{{f}}"><option value="">Select...</option>{% for option in options[f] %}<option {% if record.get(f)==option %}selected{% endif %}>{{option}}</option>{% endfor %}</select>{% elif f=='cover_letter_sent' %}<input type="checkbox" name="{{f}}" {% if record.get(f) %}checked{% endif %}>{% elif f in ['notes','job_description','requirements','interview_data'] %}<textarea name="{{f}}" rows="3">{{record.get(f) or ''}}</textarea>{% else %}<input name="{{f}}" value="{{record.get(f) or ''}}" {% if f in cfg.required %}required{% endif %} {% if f in ['application_date','response_date','date_posted'] %}type="date"{% elif f=='interview_date' %}type="datetime-local"{% elif f in ['salary_min','salary_max'] %}type="number" min="0" step="0.01"{% elif f=='email' %}type="email"{% else %}type="text"{% endif %}>{% endif %}</label>{% endfor %}</div><div class="formactions"><button class="btn" type="submit">Save record</button><a href="{{url_for('listing',table=table)}}">Cancel</a></div></form></section>{% endblock %}
